[project]
name = "fullstack-pokedex"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Thomas Le Naour", email = "t.lenaour@vitadx.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "model2vec>=0.10.0",
    "pydantic>=2.14.3",
    "rapidfuzz>=3.14.6",
    "ruff>=0.17.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
fullstack-pokedex = "fullstack_pokedex:main"
pokedex-import = "fullstack_pokedex.infrastructure.sqlite.importer:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=fullstack_pokedex", "--cov-report=term-missing"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
